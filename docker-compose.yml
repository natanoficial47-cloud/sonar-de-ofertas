services:
  # Postgres local para testar o mesmo backend usado em producao.
  # DATABASE_URL=postgresql://postgres:postgres@localhost:5432/ofertas
  db:
    image: postgres:16-alpine
    container_name: bot-ofertas-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ofertas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ofertas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
